# LLM Wiki Web 版 — Docker Swarm stack
#
# 前置步骤:
#   1. 构建并推送镜像(Swarm 不支持 build:,必须用镜像仓库):
#        docker build -f deploy/web/Dockerfile -t <registry>/llm-wiki-web:0.6.0 .
#        docker push <registry>/llm-wiki-web:0.6.0
#   2. 创建 secrets(client_secret 来自 internal-idp 的 OAuth2ClientRegistrar 输出;
#      TLS 证书为 PEM 格式,含完整证书链):
#        printf '%s' '<client-secret>' | docker secret create llm_wiki_oidc_client_secret -
#      (cookie secret 必须是 URL-safe base64:oauth2-proxy 先按 URL-safe 解码,
#       含 +/ 会解码失败、按 44 字节原始串处理而报长度错误)
#        openssl rand -base64 32 | tr -d '\n' | tr -- '+/' '-_' \
#          | docker secret create llm_wiki_cookie_secret -
#        docker secret create llm_wiki_tls_cert fullchain.pem
#        docker secret create llm_wiki_tls_key privkey.pem
#   3. 按环境改 OIDC issuer / redirect / 镜像名后部署:
#        LLM_WIKI_IMAGE=<registry>/llm-wiki-web:0.6.0 \
#        docker stack deploy -c deploy/web/docker-stack.yml llm-wiki
#
# 拓扑:浏览器 —HTTPS:7180→ oauth2-proxy(容器内 4443 终结 TLS)→ llm-wiki:19829
# llm-wiki 不发布任何端口,只在 overlay 网络内可达。
services:
  llm-wiki:
    image: da2.example.internal:9350/llm-wiki-web:0.6.0
    init: true
    stop_grace_period: 30s
    networks:
      - backend
    volumes:
      # 项目数据 + 应用状态(app-state.json、向量库等)。Web 端"打开项目"
      # 时填的服务器路径应位于 /data 下,例如 /data/projects/my-wiki
      - llm-wiki-data:/data
    environment:
      # 覆盖镜像默认值时在此处调整;LLM API 走公司代理时配置 HTTPS_PROXY 等
      LLM_WIKI_WEB_BIND: 0.0.0.0
    deploy:
      # 有状态单用户应用,必须保持单副本
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 2G
      # 数据卷为本地卷时,固定节点以免重调度后丢数据:
      # placement:
      #   constraints:
      #     - node.hostname == <your-node>

  oauth2-proxy:
    image: da2.example.internal:9350/oauth2-proxy/oauth2-proxy:v7.15.3
    networks:
      - backend
    ports:
      # oauth2-proxy 直接终结 TLS:对外 7180 → 容器内 4443
      - "7180:4443"
    configs:
      # 同一张证书身兼两职:对外 TLS 服务证书 + 验证 IdP 出站连接的信任锚
      # (IdP 与本服务同用 *.test.example.internal;建议文件为 fullchain,
      #  含 Chinalife Test Root,叶子证书轮换时信任才不受影响)
      - source: dbptest_tls_crt
        target: /etc/ssl/dbp.test.example.internal.crt
    secrets:
      - source: llm_wiki_oidc_client_secret
        target: /run/secrets/llm_wiki_oidc_client_secret
      - source: llm_wiki_cookie_secret
        target: /run/secrets/llm_wiki_cookie_secret
      - source: dbptest_tls_key
        target: /etc/ssl/dbp.test.example.internal.key
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: 数据应用管理平台
      # internal-idp 的对外 issuer,与其 application 配置及浏览器访问地址一致
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://dbp.test.example.internal:7602/dataAppManager-server
      OAUTH2_PROXY_CLIENT_ID: llm-wiki-web
      # 验证 IdP 出站连接的信任锚(与服务证书同文件);会替代系统信任库,
      # 仅作用于对 IdP 的请求
      OAUTH2_PROXY_PROVIDER_CA_FILES: /etc/ssl/dbp.test.example.internal.crt
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/secrets/llm_wiki_oidc_client_secret
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/secrets/llm_wiki_cookie_secret
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # 与 oauth2-clients-llm-wiki.yml 的 redirect-uris 逐字符一致
      OAUTH2_PROXY_REDIRECT_URL: https://dbp.test.example.internal:7180/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://llm-wiki:19829
      # 直接终结 TLS(证书含完整链)。禁用明文监听
      OAUTH2_PROXY_HTTPS_ADDRESS: 0.0.0.0:4443
      OAUTH2_PROXY_HTTP_ADDRESS: ""
      OAUTH2_PROXY_TLS_CERT_FILE: /etc/ssl/dbp.test.example.internal.crt  
      OAUTH2_PROXY_TLS_KEY_FILE: /etc/ssl/dbp.test.example.internal.key
      # oauth2-proxy 自己就是 TLS 边界,不信任 X-Forwarded-*;
      # 若将来前面再加七层代理(nginx/F5 转发),改回 "true"
      OAUTH2_PROXY_REVERSE_PROXY: "false"
      # scope 必须与客户端注册一致(oauth2-proxy 默认还会带 email,
      # 未注册该 scope 会被 Spring Authorization Server 拒绝:invalid_scope)
      OAUTH2_PROXY_SCOPE: openid profile
      # 平台用户无邮箱概念:用 sub(用户名)充当 oauth2-proxy 的用户标识
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: sub
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_COOKIE_REFRESH: 25m
      # 关键:SSE 事件流(/events)需要即时刷出
      OAUTH2_PROXY_FLUSH_INTERVAL: 1s
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s

networks:
  backend:
    driver: overlay
    driver_opts:
      # 跨节点时加密业务流量(桥接本身是明文 HTTP)
      encrypted: "true"

volumes:
  llm-wiki-data:

configs:
  dbptest_tls_crt:
    external: true

secrets:
  llm_wiki_oidc_client_secret:
    external: true
  llm_wiki_cookie_secret:
    external: true
  dbptest_tls_key:
    external: true
