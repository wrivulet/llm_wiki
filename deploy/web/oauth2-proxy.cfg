# oauth2-proxy 配置:为 llm_wiki Web 版提供 OIDC 认证,
# 身份提供方为 internal-idp(Spring Authorization Server)。
#
# 启动: oauth2-proxy --config deploy/web/oauth2-proxy.cfg
# 架构: 浏览器 —HTTPS:7180→ oauth2-proxy(终结 TLS)→ RPC 桥接(127.0.0.1:19829)
# (Swarm 部署以 docker-stack.yml 为准,本文件供非容器手工部署)

provider = "oidc"
provider_display_name = "数据应用管理平台"
oidc_issuer_url = "https://dbp.test.example.internal:7602/dataAppManager-server"

client_id = "llm-wiki-web"
# 由 OAuth2ClientRegistrar 运行结束时打印,只显示一次
client_secret = "REPLACE_WITH_GENERATED_SECRET"
code_challenge_method = "S256"

# 与客户端注册里的 redirect-uris 逐字符一致
redirect_url = "https://dbp.test.example.internal:7180/oauth2/callback"

# 上游:llm_wiki 进程内的 RPC 桥接(同时托管前端静态文件)
upstreams = ["http://127.0.0.1:19829"]

# 直接终结 TLS(PEM,含完整证书链);禁用明文监听
https_address = "0.0.0.0:7180"
http_address = ""
tls_cert_file = "/etc/llm-wiki/tls/fullchain.pem"
tls_key_file = "/etc/llm-wiki/tls/privkey.pem"
# oauth2-proxy 自身即 TLS 边界;若前面再加七层代理则改回 true
reverse_proxy = false

# scope 必须与客户端注册一致(默认多带的 email 会触发 invalid_scope)
scope = "openid profile"
# Spring Authorization Server 的用户不一定有已验证邮箱;
# 用 sub(用户名)充当用户标识,放宽 email 校验,授权控制交给 IdP 侧。
oidc_email_claim = "sub"
email_domains = ["*"]
insecure_oidc_allow_unverified_email = true

cookie_secret = "REPLACE_WITH_openssl_rand_-base64_32_OUTPUT"
cookie_secure = true
cookie_expire = "8h"
cookie_refresh = "25m"

# 关键:SSE 事件流(/events)需要即时刷出,禁止整包缓冲
flush_interval = "1s"

skip_provider_button = true
