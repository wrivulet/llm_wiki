# llm_wiki Web 版在 internal-idp(数据应用管理平台,Spring Authorization Server)
# 中的 OAuth2/OIDC 客户端注册配置。
#
# 使用平台自带的注册 CLI 执行(client_secret 由工具随机生成,运行结束打印一次):
#   java -cp dataAppManager-server-*.jar \
#        -Dloader.main=com.appmanager.tool.OAuth2ClientRegistrar \
#        org.springframework.boot.loader.launch.PropertiesLauncher \
#        deploy/web/oauth2-clients-llm-wiki.yml
#
# 打印出的 client_secret 填入 oauth2-proxy.cfg 的 client_secret 字段。

# 按实际环境修改 issuer(与浏览器访问地址一致)
issuer: https://dbp.test.example.internal:7602/dataAppManager-server

# 目标数据库,可复用平台库账号(参照 oauth2-clients-example.yml)
datasource:
  driver-class-name: dm.jdbc.driver.DmDriver
  url: jdbc:dm://127.0.0.1:5236
  username: SYSDBA
  password: SYSDBA

clients:
  - client-id: llm-wiki-web
    client-name: LLM Wiki Web
    # oauth2-proxy 支持 PKCE(S256),强制开启
    require-proof-key: true
    require-authorization-consent: false
    client-authentication-methods: [client_secret_basic]
    authorization-grant-types: [authorization_code, refresh_token]
    # 必须与 oauth2-proxy 的 redirect_url 逐字符一致
    redirect-uris:
      - https://dbp.test.example.internal:7180/oauth2/callback
    post-logout-redirect-uris:
      - https://dbp.test.example.internal:7180/
    scopes: [openid, profile]
    # oauth2-proxy 会校验 ID Token 并可调用 /userinfo,JWT 格式最稳妥
    access-token-format: self-contained
    access-token-ttl-minutes: 30
    # 文档批量导入(ingest)是浏览器标签页驱动的前端逻辑,不是后台任务——
    # 大批量导入耗时可能超过默认的 8 小时,届时刷新令牌本身过期,
    # 无论 oauth2-proxy 怎么静默刷新都救不回来,只能重新登录。
    # 调这个值需要用 overwrite: true 重跑 OAuth2ClientRegistrar 覆盖既有客户端,
    # 同时把 docker-stack.yml 里 oauth2-proxy 的 OAUTH2_PROXY_COOKIE_EXPIRE 调到一致。
    refresh-token-ttl-minutes: 1440
    # false=轮换(internal-idp 自身默认值,这里显式写出仅为自解释):每次刷新
    # access_token 都会同时发一个全新的 refresh_token,有效期从那一刻重新
    # 计算——只要用户还在活跃使用就不断顺延,不会被固定的 24 小时窗口卡死。
    # 若改成 true(复用同一个 refresh_token),到期时间从首次登录时就固定
    # 死了,不管中途多活跃都不会延长,大批量导入更容易撞上这个硬截止点。
    reuse-refresh-tokens: false
    overwrite: true
